    <rect x="34" y="52" width="12" height="26" rx="4" fill="#FDE68A"/>
    <!-- Paint Drip -->
    <circle cx="20" cy="44" r="4" fill="#C4B5FD"/>
    <path d="M32 34 Q32 46 35 48 Q38 46 38 34 Z" fill="#C4B5FD"/>
  </g>
</svg>