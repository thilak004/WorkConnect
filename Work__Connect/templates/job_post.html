<!DOCTYPE html>
<html lang="{{ active_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('nav_post_job') }} | WorkConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="post-job-page" style="background: var(--wc-background);">

    <!-- Navigation Header -->
    <header class="navbar">
        <a class="brand" href="{{ url_for('home') }}">
            <div class="brand-name">Work<span>Connect</span></div>
        </a>
        <div style="display: flex; align-items: center; gap: var(--wc-space-3);">
            <div class="lang-selector">
                <a href="{{ url_for('set_language', lang_code='en') }}" class="lang-btn {% if active_lang == 'en' %}active{% endif %}">EN</a>
                <a href="{{ url_for('set_language', lang_code='te') }}" class="lang-btn {% if active_lang == 'te' %}active{% endif %}">తెలుగు</a>
                <a href="{{ url_for('set_language', lang_code='hi') }}" class="lang-btn {% if active_lang == 'hi' %}active{% endif %}">हिन्दी</a>
            </div>
            <a href="{{ url_for('employer_dashboard') }}" class="nav-link">← {{ t('nav_employer_dashboard') }}</a>
        </div>
    </header>

    <main class="wc-container" style="max-width: 640px; padding: var(--wc-space-10) 0;">
        <header class="post-job-heading" style="text-align: center; margin-bottom: var(--wc-space-6);">
            <p class="jobs-eyebrow" style="color: var(--wc-primary); font-weight: var(--wc-font-weight-extrabold); font-size: var(--wc-text-xs); margin: 0 0 var(--wc-space-1);">EMPLOYER PORTAL</p>
            <h1 style="font-size: var(--wc-text-xl); font-weight: var(--wc-font-weight-extrabold); color: var(--wc-heading); margin: 0 0 var(--wc-space-2);">{{ t('nav_post_job') }}</h1>
            <p style="font-size: var(--wc-text-sm); color: var(--wc-text-muted); margin: 0;">Specify job title, required trade, daily wage, and worker count.</p>
        </header>

        <section class="card card-padded" style="max-width: 640px; margin: 0 auto;">
            <form action="{{ url_for('post_job') }}" method="POST" class="registration-form" style="display: flex; flex-direction: column; gap: var(--wc-space-4);">

                <div class="form-field">
                    <label class="form-label">Posting Employer</label>
                    <input type="text" value="{{ employer.name }} ({{ employer.email }})" readonly class="form-input" style="background: var(--wc-surface-hover);">
                </div>

                <div class="form-field">
                    <label class="form-label" for="title">Job Title</label>
                    <input id="title" name="title" type="text" placeholder="e.g. House Electrician Needed, Tractor Driver" required class="form-input">
                </div>

                <div class="form-field">
                    <label class="form-label" for="skill_required">Required Trade / Skill</label>
                    <select id="skill_required" name="skill_required" required class="form-select">
                        <option value="">Select required trade</option>
                        <option value="Electrician">Electrician / ఎలక్ట్రీషియన్ / ఇలెక్ట్రికల్ పని</option>
                        <option value="Mason">Mason / మేస్త్రీ / భవన నిర్మాణం</option>
                        <option value="Driver">Driver / డ్రైవర్ / రవాణా</option>
                        <option value="Painter">Painter / పెయింటర్ / రంగుల పని</option>
                        <option value="Farming">Farm Worker / వ్యవసాయ కూలీ</option>
                        <option value="Carpenter">Carpenter / వడ్రంగి పని</option>
                        <option value="Plumbing">Plumber / ప్లంబర్</option>
                        <option value="Helper">General Helper / సహాయకుడు</option>
                    </select>
                </div>

                <div class="form-field">
                    <label class="form-label" for="location">Job Location (Town or Locality)</label>
                    <input id="location" name="location" type="text" placeholder="e.g. Narasapur, Kavitam" value="{{ employer.location }}" required class="form-input">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--wc-space-3);">
                    <div class="form-field">
                        <label class="form-label" for="workers_needed">Workers Needed</label>
                        <input id="workers_needed" name="workers_needed" type="number" min="1" max="1000" value="1" required class="form-input">
                    </div>

                    <div class="form-field">
                        <label class="form-label" for="daily_wage">Daily Wage (₹/day)</label>
                        <input id="daily_wage" name="daily_wage" type="number" min="0" step="10" placeholder="e.g. 700" required class="form-input">
                    </div>
                </div>

                <div class="form-field">
                    <label class="form-label" for="description">Job Description & Instructions</label>
                    <textarea id="description" name="description" rows="3" placeholder="Describe the specific work, timings, tools provided, or site instructions..." required class="form-input"></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block">
                    ✓ Publish Job Requirement <span>→</span>
                </button>
            </form>
        </section>
    </main>
    {% include 'partials/ai_assistant.html' %}

</body>
</html>
