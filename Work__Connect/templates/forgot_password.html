<!DOCTYPE html>
<html lang="{{ active_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | WorkConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background: #f7f9fd; margin: 0; font-family: Arial, sans-serif;">
    <header class="navbar" style="background: #fff; border-bottom: 1px solid #e3eaf2; padding: 0 4%; height: 56px; display: flex; align-items: center;">
        <a href="{{ url_for('home') }}" style="font-size: 18px; font-weight: 800; color: #172b4d; text-decoration: none;">Work<span style="color: #2864c9;">Connect</span></a>
    </header>

    <main style="padding: 40px 20px;">
        <section style="max-width: 440px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 32px 28px; box-shadow: 0 8px 30px rgba(15,23,42,.08); border: 1px solid #e2e8f0;">
            <h1 style="font-size: 22px; color: #1e293b; text-align: center; margin-top: 0;">Reset Password</h1>

            {% if error %}
                <div style="padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; font-size: 13px;">⚠️ {{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('forgot_password') }}">
                <input type="hidden" name="role" value="{{ active_tab }}">

                <div style="margin-bottom: 18px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #334155;">Account type</label>
                    <div style="display: flex; gap: 10px;">
                        <label style="flex: 1; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer;">
                            <input type="radio" name="role-selector" value="worker" {% if active_tab != 'employer' %}checked{% endif %} onchange="this.form.elements.role.value='worker'"> Worker
                        </label>
                        <label style="flex: 1; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer;">
                            <input type="radio" name="role-selector" value="employer" {% if active_tab == 'employer' %}checked{% endif %} onchange="this.form.elements.role.value='employer'"> Employer
                        </label>
                    </div>
                </div>

                <div style="margin-bottom: 18px;">
                    <label for="email" style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #334155;">Registered Email</label>
                    <input id="email" name="email" type="email" value="{{ email|default('', true) }}" required placeholder="name@example.com" style="width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>

                <div style="margin-bottom: 18px;">
                    <label for="new-password" style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #334155;">New Password</label>
                    <input id="new-password" name="new_password" type="password" required minlength="8" placeholder="At least 8 characters" style="width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px;">
                    <label style="display: flex; align-items: center; gap: 6px; margin-top: 7px; color: #64748b; font-size: 12px; cursor: pointer;">
                        <input type="checkbox" data-toggle-password="new-password"> Show new password
                    </label>
                </div>

                <div style="margin-bottom: 22px;">
                    <label for="confirm-password" style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #334155;">Confirm New Password</label>
                    <input id="confirm-password" name="confirm_password" type="password" required minlength="8" placeholder="Repeat new password" style="width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px;">
                    <label style="display: flex; align-items: center; gap: 6px; margin-top: 7px; color: #64748b; font-size: 12px; cursor: pointer;">
                        <input type="checkbox" data-toggle-password="confirm-password"> Show confirmed password
                    </label>
                </div>

                <button type="submit" class="btn-apply-big" style="width: 100%;">Reset Password</button>
            </form>

            <p style="text-align: center; margin: 20px 0 0; font-size: 13px; color: #64748b;">
                <a href="{{ url_for('login', role=active_tab) }}" style="color: #2864c9; font-weight: 700; text-decoration: none;">Back to Login</a>
            </p>
        </section>
    </main>

    <script>
        document.querySelectorAll('[data-toggle-password]').forEach(function (checkbox) {
            checkbox.addEventListener('change', function () {
                const input = document.getElementById(this.dataset.togglePassword);
                input.type = this.checked ? 'text' : 'password';
            });
        });
    </script>
</body>
</html>
