<!DOCTYPE html>
<html lang="{{ active_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery Unavailable | WorkConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background: var(--wc-background); margin: 0; font-family: var(--wc-font-sans);">
    <!-- Navigation Header -->
    <header class="navbar">
        <a class="brand" href="{{ url_for('home') }}">
            <div class="brand-name">Work<span>Connect</span></div>
        </a>
    </header>

    <main style="padding: var(--wc-space-10) var(--wc-space-4);">
        <section class="card card-padded" style="max-width: 440px; margin: 0 auto;">
            <h1 style="font-size: var(--wc-text-xl); font-weight: var(--wc-font-weight-extrabold); color: var(--wc-heading); text-align: center; margin-top: 0;">Password recovery unavailable</h1>
            <div role="status" style="padding: var(--wc-space-3) var(--wc-space-4); border-radius: var(--wc-radius-md); margin-bottom: var(--wc-space-5); background: var(--wc-info-bg); color: var(--wc-info); border: var(--wc-border-width) solid #bfdbfe; font-size: var(--wc-text-sm); line-height: 1.6;">
                Password recovery is temporarily unavailable while verified email recovery is being set up. This page will not ask for your password or change your account.
            </div>
            <p style="text-align: center; margin: var(--wc-space-5) 0 0; font-size: var(--wc-text-sm); color: var(--wc-text-muted);">
                <a href="{{ url_for('login', role=active_tab) }}" style="color: var(--wc-primary); font-weight: var(--wc-font-weight-bold); text-decoration: none;">Back to Login</a>
            </p>
        </section>
    </main>
    {% include 'partials/ai_assistant.html' %}

</body>
</html>
