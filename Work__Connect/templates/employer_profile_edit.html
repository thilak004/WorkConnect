<!DOCTYPE html>
<html lang="{{ active_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('edit_profile') }} | WorkConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .edit-card {
            max-width: 580px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 18px;
            padding: 32px 28px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-control:focus {
            outline: none;
            border-color: #2864c9;
            box-shadow: 0 0 0 3px rgba(40, 100, 201, 0.15);
        }
    </style>
</head>
<body style="background: #f7f9fd;">

    <header class="navbar" style="background: #ffffff; border-bottom: 1px solid #e3eaf2; padding: 0 4%; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;">
        <a href="{{ url_for('home') }}" style="font-size: 18px; font-weight: 800; color: #172b4d; text-decoration: none; display: flex; align-items: center; gap: 6px;">
            Work<span style="color: #2864c9;">Connect</span>
        </a>
        <div style="display: flex; align-items: center; gap: 12px;">
            <div class="lang-selector">
                <a href="{{ url_for('set_language', lang_code='en') }}" class="lang-btn {% if active_lang == 'en' %}active{% endif %}">EN</a>
                <a href="{{ url_for('set_language', lang_code='te') }}" class="lang-btn {% if active_lang == 'te' %}active{% endif %}">తెలుగు</a>
                <a href="{{ url_for('set_language', lang_code='hi') }}" class="lang-btn {% if active_lang == 'hi' %}active{% endif %}">हिन्दी</a>
            </div>
            <a href="{{ url_for('employer_dashboard') }}" style="font-size: 13px; font-weight: 700; color: #2864c9; text-decoration: none;">
                ← {{ t('nav_employer_dashboard') }}
            </a>
        </div>
    </header>

    <main style="padding: 20px;">
        <div class="edit-card">
            <h1 style="font-size: 22px; font-weight: 800; color: #1e293b; margin: 0 0 6px 0;">
                {{ t('edit_profile') }}
            </h1>
            <p style="font-size: 13px; color: #64748b; margin: 0 0 22px 0;">
                Update your company or contractor profile and contact phone number.
            </p>

            <form method="POST" action="{{ url_for('employer_profile_edit') }}">
                <div class="form-group">
                    <label>Company / Contractor Name</label>
                    <input type="text" name="name" class="form-control" value="{{ employer.name }}" required>
                </div>

                <div class="form-group">
                    <label>Mobile Phone Number</label>
                    <input type="tel" name="phone" class="form-control" value="{{ employer.phone or '' }}" placeholder="e.g. 9876543210">
                </div>

                <div class="form-group">
                    <label>Employer Type</label>
                    <select name="employer_type" class="form-control" required>
                        <option value="Contractor" {% if employer.employer_type == 'Contractor' %}selected{% endif %}>Contractor / కాంట్రాక్టర్ / ठेकेदार</option>
                        <option value="Builder" {% if employer.employer_type == 'Builder' %}selected{% endif %}>Builder / బిల్డర్ / बिल्डर</option>
                        <option value="Business Owner" {% if employer.employer_type == 'Business Owner' %}selected{% endif %}>Business Owner / వ్యాపార యజమాని / व्यावसायिक स्वामी</option>
                        <option value="Household" {% if employer.employer_type == 'Household' %}selected{% endif %}>Household / గృహ అవసరం / घरेलू कार्य</option>
                        <option value="Other" {% if employer.employer_type == 'Other' %}selected{% endif %}>Other / ఇతరులు / अन्य</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Location (City / Town / Village)</label>
                    <input type="text" name="location" class="form-control" value="{{ employer.location }}" required>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" class="btn-apply-big" style="flex: 1;">
                        ✓ {{ t('save_changes') }}
                    </button>
                    <a href="{{ url_for('employer_dashboard') }}" style="display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13px; font-weight: 700; color: #64748b; text-decoration: none;">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
