<!DOCTYPE html>
<html lang="{{ active_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('edit_profile') }} | WorkConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background: var(--wc-background);">

    <!-- Navigation Header -->
    <header class="navbar">
        <a class="brand" href="{{ url_for('home') }}">
            <div class="brand-name">Work<span>Connect</span></div>
        </a>
        <div style="display: flex; align-items: center; gap: var(--wc-space-3);">
            <div class="lang-selector">
                <a href="{{ url_for('set_language', lang_code='en') }}" class="lang-btn {% if active_lang == 'en' %}active{% endif %}">EN</a>
                <a href="{{ url_for('set_language', lang_code='te') }}" class="lang-btn {% if active_lang == 'te' %}active{% endif %}">తెలుగు</a>
                <a href="{{ url_for('set_language', lang_code='hi') }}" class="lang-btn {% if active_lang == 'hi' %}active{% endif %}">हिन्दी</a>
            </div>
            <a href="{{ url_for('employer_dashboard') }}" class="nav-link">← {{ t('nav_employer_dashboard') }}</a>
        </div>
    </header>

    <main class="wc-container" style="max-width: 580px; padding: var(--wc-space-10) 0;">
        <div class="card card-padded">
            <h1 style="font-size: 22px; font-weight: 800; color: #1e293b; margin: 0 0 6px 0;">
                {{ t('edit_profile') }}
            </h1>
            <p style="font-size: 13px; color: #64748b; margin: 0 0 22px 0;">
                Update your company or contractor profile and contact phone number.
            </p>

            <form method="POST" action="{{ url_for('employer_profile_edit') }}">
                <div class="form-field">
                    <label class="form-label">Company / Contractor Name</label>
                    <input type="text" name="name" class="form-input" value="{{ employer.name }}" required>
                </div>

                <div class="form-field">
                    <label class="form-label">Mobile Phone Number</label>
                    <input type="tel" name="phone" class="form-input" value="{{ employer.phone or '' }}" placeholder="e.g. 9876543210">
                </div>

                <div class="form-field">
                    <label class="form-label">Employer Type</label>
                    <select name="employer_type" class="form-select" required>
                        <option value="Contractor" {% if employer.employer_type == 'Contractor' %}selected{% endif %}>Contractor / కాంట్రాక్టర్ / ठेकेदार</option>
                        <option value="Builder" {% if employer.employer_type == 'Builder' %}selected{% endif %}>Builder / బిల్డర్ / बिल्डर</option>
                        <option value="Business Owner" {% if employer.employer_type == 'Business Owner' %}selected{% endif %}>Business Owner / వ్యాపార యజమాని / व्यावसायिक स्वामी</option>
                        <option value="Household" {% if employer.employer_type == 'Household' %}selected{% endif %}>Household / గృహ అవసరం / घरेलू कार्य</option>
                        <option value="Other" {% if employer.employer_type == 'Other' %}selected{% endif %}>Other / ఇతరులు / अन्य</option>
                    </select>
                </div>

                <div class="form-field">
                    <label class="form-label">Location (City / Town / Village)</label>
                    <input type="text" name="location" class="form-input" value="{{ employer.location }}" required>
                </div>

                <div style="display: flex; gap: var(--wc-space-3); margin-top: var(--wc-space-6);">
                    <button type="submit" class="btn btn-primary btn-lg" style="flex: 1;">
                        ✓ {{ t('save_changes') }}
                    </button>
                    <a href="{{ url_for('employer_dashboard') }}" class="btn btn-outline btn-lg" style="flex: 1;">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>

    {% include 'partials/ai_assistant.html' %}

</body>
</html>
